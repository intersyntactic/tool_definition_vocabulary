dependencies:
  checked_json: ^0.4.0
  is_model_vocabulary: ^0.5.0
  is_sign_in_vocabulary: ^0.1.0
  is_web_address_vocabulary: ^0.1.2

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.25.0
